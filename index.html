const questions=['Which studies inform smoke detector design?','Could combustion persist after a visible flame disappears?','What evidence is relevant to a lunar habitat?','How does ventilation affect solid-material burning?'];
function assistantView(){return `${pageHead('Evidence assistant','Natural-language discovery, with source-linked evidence and explicit limits.',`<button class="btn subtle" data-view="sources">${icon('info')}How it works</button>`)}<div class="assistant-shell"><div class="assistant-intro"><div class="assistant-logo">${icon('sparkles')}</div><h2>Start with a better question.</h2><p>Find relevant research across this curated collection. Enable on-device AI for semantic matching, or use the offline keyword search.</p></div><div class="question-grid">${questions.map((q,i)=>`<button class="question-btn" data-question="${i}">${q}${icon('arrow')}</button>`).join('')}</div><form class="askbox" id="askForm"><textarea id="questionInput" placeholder="Ask about smoke, airflow, cool flames, materials, or mission evidence…" aria-label="Research question" maxlength="600"></textarea><div class="askbox-bottom"><label class="ai-toggle"><input type="checkbox" id="enableAI" ${state.aiWanted?'checked':''}>Use on-device AI <span class="muted">· model download</span></label><button class="btn primary" type="submit" id="askBtn">Find evidence ${icon('arrow')}</button></div></form><div class="model-status" id="modelStatus" role="status">${state.aiReady?'MiniLM ready · queries processed in your browser':state.aiBusy?'Loading AI model…':'Offline keyword mode · AI matching is optional and needs internet on first use'}</div><div id="answerRoot" aria-live="polite">${state.answer}</div><p class="small muted" style="font-size:10px;margin-top:18px">This assistant retrieves and assembles curated evidence. It does not generate scientific claims, simulate fire, or infer safety thresholds.</p></div>${footer()}`}
function atmosphereView(){return `${pageHead('Atmosphere lens','Explore atmospheric context without turning it into an unsupported fire-risk prediction.',`<button class="btn subtle" data-question="2">${icon('sparkles')}Find relevant evidence</button>`)}<div class="atmosphere-grid"><section class="panel panel-padding"><div class="between"><h2>Define a research scenario</h2><span class="tag source">Context only</span></div><p class="small" style="margin-top:8px">Illustrative atmosphere inputs; not mission specifications.</p><div class="lens-control"><label for="oxygenSlider">Oxygen volume fraction <strong id="o2Label">${state.oxygen}%</strong></label><input id="oxygenSlider" type="range" min="15" max="40" step="1" value="${state.oxygen}"></div><div class="lens-control"><label for="pressureSlider">Total pressure <strong id="pressureLabel">${state.pressure.toFixed(1)} psi</strong></label><input id="pressureSlider" type="range" min="6" max="15" step="0.1" value="${state.pressure}"></div><div class="row" style="flex-wrap:wrap"><button class="chip" data-atmo="earth" style="border-color:var(--line)">Earth-like · 21% / 14.7 psi</button><button class="chip" data-atmo="example" style="border-color:var(--line)">Example · 30% / 10.2 psi</button></div><div class="o2bar"><div id="o2Fill" style="width:${state.oxygen}%">O₂</div></div><div class="between small muted" style="font-size:10px"><span>Oxygen</span><span>Balance of atmosphere (not specified)</span></div><div class="atmo-stats"><div class="atmo-stat"><span>O₂ partial pressure</span><strong id="partialPressure"></strong></div><div class="atmo-stat"><span>O₂ fraction vs 21%</span><strong id="fractionChange"></strong></div></div><p class="lens-note">Calculated using p(O₂) = oxygen fraction × total pressure. Similar oxygen partial pressures do not establish equivalent flammability: concentration, total pressure, flow, fuel and gravity all matter.</p></section><div class="stack"><section class="panel panel-padding"><div class="eyebrow" style="margin-bottom:10px">THE TRANSFER QUESTION</div><h2>Orbit is not the lunar surface.</h2><p class="lens-note" style="margin-top:11px">The studies in this collection represent orbital microgravity. A lunar habitat (~0.16 g) or Mars habitat (~0.38 g) introduces buoyant transport that is not directly measured here.</p><div class="finding-box"><p>These sliders calculate atmosphere properties. They do not predict ignition, flame spread, extinction, or a safe oxygen limit.</p></div><button class="text-btn" data-view="sources">Read the methodology ${icon('arrow')}</button></section><section class="panel panel-padding"><h3>Start with these investigations</h3><p class="small" style="margin-top:7px;font-size:11px">Each answers a different part of the atmosphere question.</p>${['BASS-II','BRE','FLEX','CFI-G'].map(id=>{let d=study(id);return `<button class="between" style="width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left" data-study="${id}"><span style="font-size:12px">${id} <span class="muted small" style="font-size:10px;margin-left:7px">${d.category}</span></span>${icon('chevron')}</button>`}).join('')}<p class="small muted" style="font-size:10px;margin-top:13px">CFI-G’s 85% O₂ refers to a burner stream. It is not a crew-cabin test atmosphere.</p></section></div></div>${footer()}`}
function sourcesView(){return `${pageHead('Sources & methods','An inspectable chain from source to summary, interpretation and ranking.',`<button class="btn subtle" data-export="json">${icon('download')}Export metadata JSON</button>`)}<div class="methods-grid"><section class="panel method-card"><h3>How relevance is calculated</h3><p>Each study has curator-assigned components from 0 to 5. The selected mission changes the transfer component. Components organize research attention; they are not measured scientific performance.</p><div class="formula mono">Index = 10 × directness + 6 × mission fit + 4 × detail</div><p><strong>Directness (50%)</strong>: connection to a crew fire-safety question.<br><strong>Mission fit (30%)</strong>: how relevant the study is to that use case; partial-gravity gaps lower transfer scores.<br><strong>Detail (20%)</strong>: depth of documented configuration and diagnostics in this review, not a study-quality judgment.</p></section><section class="panel method-card"><h3>What is—and is not—in this file</h3><p>18 curated investigation summaries, source links, documented conditions and explicitly labeled interpretations. Source review: 14 November 2026. This is a static research snapshot, with no live PSI connection.</p><ul><li>No raw run files or synthetic experimental curves.</li><li>Missing numeric values stay null in the export; design ranges remain text.</li><li>Ranks are relevance indices, never probabilities or material safety certifications.</li><li>No direct partial-gravity experiment is included. Electrical forcing is a transport analogy, not a lunar test.</li></ul></section><section class="panel method-card"><h3>AI and evidence assembly</h3><p>Optional semantic search combines a quantized MiniLM sentence-embedding model, keyword matching and explicit topic boosts through Transformers.js. It downloads from third-party CDNs / Hugging Face, then computes embeddings and query matches in this browser. The question text is not sent to a model API.</p><p style="margin-top:10px">AI ranking combines 70% embedding similarity, 30% expanded-keyword match and topic boosts (up to 0.26) for direct experimental evidence. Answers are assembled from curated records with citations and caveats. This is extractive evidence assistance, not generative chat. The offline fallback uses expanded keywords and names; its status is always shown. Relevance scores are independent of the AI similarity calculation.</p><p style="margin-top:10px"><a href="https://huggingface.co/docs/transformers.js/v3.8.1/en/api/pipelines" target="_blank" rel="noopener noreferrer">Transformers.js documentation ↗</a> · <a href="https://huggingface.co/Xenova/all-MiniLM-L6-v2" target="_blank" rel="noopener noreferrer">Model information ↗</a></p></section><section class="panel method-card"><h3>Using the collection for modeling</h3><p>CSV and JSON exports contain investigation-level metadata with provenance. They are an index to source data, not a fitted or training-ready combustion dataset.</p><p style="margin-top:10px">The model-input template records the fields to extract: run ID, material, geometry, oxygen fraction, total pressure, flow vector, gravity, diagnostics, measurement uncertainty, response and source file. Populate verified values and retain units before comparing or pooling runs.</p><button class="text-btn" data-export="schema">Download run-data template ${icon('download')}</button></section></div><div class="notice">${icon('info')}<p><strong>Source checks.</strong> The supplied NASA SVS link <a href="https://svs.gsfc.nasa.gov/3139" target="_blank" rel="noopener noreferrer">3139</a> is a Hurricane Isabel visualization and is excluded. The ResearchGate “Fire in Microgravity” PDF is an author-posted copy of the American Scientist article, not independent corroboration. The ScienceDirect paper is linked with restricted-access status.</p></div><div class="between" style="margin:28px 0 12px"><h2>Source library</h2><span class="small muted">${Object.keys(SOURCES).length} references</span></div><div class="sources-list">${Object.entries(SOURCES).map(([k,s],i)=>`<article class="source-item"><span class="source-index">${String(i+1).padStart(2,'0')}</span><div><h3><a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ${icon('external')}</a></h3><div class="source-org">${esc(s.org)}</div><p>${esc(s.note)}${s.alternate?` <a href="${s.alternate}" target="_blank" rel="noopener noreferrer">Author-posted reprint ↗</a>`:''}</p></div></article>`).join('')}</div>${footer()}`}
function render(){renderNav();document.getElementById('content').innerHTML=({overview,explore:explorer,compare:compareView,assistant:assistantView,atmosphere:atmosphereView,sources:sourcesView}[state.view])();if(state.view==='explore')updateStudyList();if(state.view==='atmosphere')updateAtmosphere();renderTray();initIcons()}
function navigate(v){if(!views.some(x=>x[0]===v))return;state.view=v;render();document.getElementById('sidebar').classList.remove('open');window.scrollTo({top:0});}
function renderTray(){const el=document.getElementById('compareTray');if(!state.selected.length||state.view==='compare'){el.classList.add('hidden');return}el.classList.remove('hidden');el.innerHTML=`<span>${icon('compare')} <strong>${state.selected.length}</strong> selected <span class="muted">· ${state.selected.map(esc).join(', ')}</span></span><div class="row"><button class="btn subtle" data-clear-compare style="padding:6px 9px">Clear</button><button class="btn primary" data-view="compare">Compare ${icon('arrow')}</button></div>`}
function selection(id,checked){if(checked&&!state.selected.includes(id)){if(state.selected.length>=3){toast('Compare up to three investigations at a time.');document.querySelectorAll('[data-select]').forEach(el=>el.checked=state.selected.includes(el.dataset.select));return}state.selected.push(id)}else if(!checked)state.selected=state.selected.filter(x=>x!==id);storeState();renderTray();document.querySelectorAll('[data-select]').forEach(el=>el.checked=state.selected.includes(el.dataset.select))}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),4200)}
function showStudy(id){const d=study(id);if(!d)return;lastFocused=document.activeElement;const sourceLinks=d.sources.map(k=>{let s=SOURCES[k];return `<a class="drawer-source" href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ${icon('external')}<small>${esc(s.org)}</small></a>`}).join('');document.getElementById('drawerRoot').innerHTML=`<div class="drawer-backdrop" data-close-drawer></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-header">${tag(d.category)}<button class="close-btn" data-close-drawer aria-label="Close investigation">${icon('close')}</button></div><h2 id="drawerTitle">${d.id}</h2><div class="full-name">${esc(d.name)}</div><p class="summary">${esc(d.summary)}</p><div class="row"><button class="btn primary" data-toggle-study="${d.id}">${icon('compare')}${state.selected.includes(d.id)?'Remove from comparison':'Add to comparison'}</button><span class="small muted">Microgravity · source summary</span></div><section class="drawer-section"><h3>Reported observation / study focus</h3><div class="finding-box"><p>${esc(d.finding)}</p></div><h3 style="margin-top:17px">Research interpretation</h3><p>${esc(d.implication)}</p></section><section class="drawer-section"><h3>Experimental context</h3><div class="detail-grid">${[['Fuel / source',d.fuel],['Sample / burner',d.shape],['Hardware',d.hardware],['Pressure',d.pressure],['Oxygen',d.oxygen],['Airflow',d.airflow]].map(([l,v])=>`<div class="detail-cell"><label>${l}</label><p>${esc(v)}</p></div>`).join('')}</div><h3 style="margin-top:18px">Variables</h3><p>${esc(d.variables)}</p><h3 style="margin-top:18px">Measurements</h3><p>${esc(d.measurements)}</p></section><section class="drawer-section"><h3>Why it ranks here <span class="muted">· ${score(d)} / 100</span></h3><p>Context: ${missions[state.mission].name}. Curator-assigned relevance, not an experimental risk metric.</p><div class="score-breakdown"><div class="score-part"><strong>${d.direct}/5</strong>Safety directness<br>× 10</div><div class="score-part"><strong>${d.mission[state.mission]}/5</strong>Mission fit<br>× 6</div><div class="score-part"><strong>${d.detail}/5</strong>Documented detail<br>× 4</div></div></section><section class="drawer-section"><h3>Limits & transferability</h3><p>${esc(d.limits)}</p><p style="margin-top:8px">No run-level measurements are bundled. Direct partial-gravity validation is absent from this collection.</p></section><section class="drawer-section"><h3>Trace the evidence</h3>${sourceLinks}</section></aside>`;document.body.style.overflow='hidden';document.querySelector('[aria-label="Close investigation"]').focus()}
function closeDrawer(){document.getElementById('drawerRoot').innerHTML='';document.body.style.overflow='';if(lastFocused&&document.contains(lastFocused))lastFocused.focus()}
function updateAtmosphere(){const p=state.oxygen/100*state.pressure,change=(state.oxygen/21-1)*100;document.getElementById('o2Label').textContent=state.oxygen+'%';document.getElementById('pressureLabel').textContent=state.pressure.toFixed(1)+' psi';document.getElementById('partialPressure').textContent=p.toFixed(2)+' psi';document.getElementById('fractionChange').textContent=(change>=0?'+':'')+change.toFixed(1)+'%';document.getElementById('o2Fill').style.width=state.oxygen+'%'}
const stopwords=new Set('a an and are as at be by can could do does for from how i if in into is it me of on or our that the their these this to using was were what when which with would you your about'.split(' '));
function tokens(t){return t.toLowerCase().replace(/[^a-z0-9-]+/g,' ').split(/\s+/).filter(x=>x.length>1&&!stopwords.has(x))}
function lexicalScores(q){let expanded=q.toLowerCase();const groups=[[/detector|sensor|alarm|smoke/, ' smoke detection aerosol SAME SAME-R DAFT particles'],[/lunar|moon|rover|mars|habitat/,' oxygen atmosphere material BASS-II BRE partial gravity'],[/extinguish|suppres|disappear|invisible|persist|hidden/,' FLEX CFI cool flame suppression extinction low temperature'],[/ventilation|airflow|air flow|flow|fan/,' BASS-II SAFFIRE-III ventilation airflow solid flow'],[/material|plastic|fabric|solid/,' BASS BASS-II BRE SAFFIRE material solid fabric']];groups.forEach(([test,add])=>{if(test.test(expanded))expanded+=add});let qt=tokens(expanded);return STUDIES.map(d=>{let text=`${d.name} ${d.category} ${d.summary} ${d.finding} ${d.tags} ${d.variables}`.toLowerCase();let s=qt.reduce((n,t)=>n+(text.includes(t)?1:0),0);if(q.toLowerCase().includes(d.id.toLowerCase()))s+=8;return {id:d.id,value:s/Math.max(qt.length,1)}}).sort((a,b)=>b.value-a.value)}
async function enableModel(){state.aiWanted=true;if(state.aiReady)return;if(modelPromise)return modelPromise;state.aiBusy=true;const status=t=>{let el=document.getElementById('modelStatus');if(el)el.textContent=t};status('Downloading on-device AI · first load may take a minute…');modelPromise=(async()=>{try{const lib=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');lib.env.allowLocalModels=false;lib.env.backends.onnx.wasm.numThreads=1;model=await lib.pipeline('feature-extraction','Xenova/all-MiniLM-L6-v2',{dtype:'q8',device:'wasm',progress_callback:p=>{if(p.status==='progress'&&p.file?.endsWith('.onnx'))status(`Loading MiniLM weights · ${Math.round(p.progress||0)}%`);else if(p.status==='initiate')status('Loading local semantic search model…')}});status('Indexing the 18 curated investigations in this browser…');const docs=STUDIES.map(d=>`${d.id}. ${d.name}. ${d.summary} ${d.finding} ${d.tags}`);let out=await model(docs,{pooling:'mean',normalize:true});embeddings=out.tolist();state.aiReady=true;status('MiniLM ready · on-device semantic matching active');toast('AI semantic search is ready. Queries stay in your browser.')}catch(error){modelPromise=null;state.aiWanted=false;state.aiReady=false;model=null;let toggle=document.getElementById('enableAI');if(toggle)toggle.checked=false;status('Model unavailable · offline keyword search remains available. Check internet / CDN access.');toast('The AI model could not load. Offline evidence search still works.')}finally{state.aiBusy=false}})();return modelPromise}
function topicBonus(q,id){if(/smoke|detector|alarm|sensor/i.test(q))return ({'SAME':.22,'SAME-R':.15,'DAFT':.06})[id]||0;if(/disappear|invisible|hidden|cool.flame/i.test(q))return ({'FLEX':.26,'CFI':.15,'CFI-G':.08})[id]||0;if(/lunar|moon|mars|rover|habitat/i.test(q))return ({'BASS-II':.18,'BRE':.18,'FLEX':.05})[id]||0;if(/flow|ventilation|fan/i.test(q))return ({'BASS-II':.20,'SAFFIRE-III':.12,'SAFFIRE-I':.06})[id]||0;return 0}
function synthesize(q,ids,mode){const ds=ids.map(study);let context='The records below are the closest evidence matches in this collection. Read their limitations before transferring a result to a different fuel, scale or atmosphere.';let boundary='No numerical fire-risk estimate or operational threshold can be derived from these summaries.';if(/lunar|moon|mars|rover|partial/i.test(q)){context='No direct partial-gravity experiment is included in this collection. Solid-material and atmosphere studies are useful starting points, but orbital microgravity findings need validation at the intended gravity, pressure, oxygen fraction and flow.';boundary='The atmosphere lens can calculate oxygen partial pressure. It does not calculate flammability. CFI-G’s oxygen-rich burner stream is not a habitable-cabin test.'}else if(/smoke|detector|alarm|sensor/i.test(q)){context='SAME and SAME-R directly address smoke characteristics and detection. DAFT supports instrument feasibility. Particle properties and transport both matter, so detector readings need to be interpreted alongside source and flow conditions.';boundary='A dust instrument’s flight heritage alone does not establish fire-detection sensitivity. No universal alarm threshold is supplied.'}else if(/disappear|invisible|cool|hidden|extinguish/i.test(q)){context='FLEX provides evidence of continued droplet consumption after a visible flame disappeared under certain conditions. CFI and CFI-G explore related low-temperature chemistry with different fuel configurations.';boundary='Hot-flame extinction, cool-flame extinction and complete reaction termination are different events. These droplet and burner observations do not set a cabin suppression dose.'}else if(/flow|ventilation|fan/i.test(q)){context='BASS-II reports low-flow flame persistence and sensitivity to ventilation changes. Saffire studies add large-scale configurations. The records support examining flow magnitude, direction and transients rather than assuming a monotonic response.';boundary='Ventilation effects depend on fuel, oxygen and geometry. A summary cannot establish that shutting off or increasing a fan will safely extinguish a particular fire.'}return `<article class="answer"><div class="answer-question">${esc(q)}</div><div class="insight-title">${icon('sparkles')}EVIDENCE BRIEF <span class="tag source" style="margin-left:auto">${mode==='ai'?'AI + keyword retrieval':'Offline keyword retrieval'}</span></div><h3>What the evidence supports</h3><p>${context}</p><div class="answer-evidence">${ds.map((d,i)=>`<section class="evidence-item"><div class="between"><button class="study-title" data-study="${d.id}"><strong>[${i+1}] ${d.id}</strong></button>${tag(d.category)}</div><p><strong style="font-size:10px;color:#9eb8d0">Observation / study focus.</strong> ${esc(d.finding)}</p><p><strong style="font-size:10px;color:#c0abdf">Interpretation.</strong> ${esc(d.implication)}</p><p class="muted" style="font-size:10px">Limit: ${esc(d.limits)}</p><a href="${SOURCES[d.sources[0]].url}" target="_blank" rel="noopener noreferrer">${esc(SOURCES[d.sources[0]].org)} · Open source ↗</a></section>`).join('')}</div><div class="answer-foot"><strong>Boundary of the evidence.</strong> ${boundary}<br><span class="muted">Assembled from curated investigation summaries · no generative model or raw-data analysis.</span></div></article>`}
async function ask(q){if(askInFlight){toast('A search is already running.');return}q=q.trim().slice(0,600);if(!q){toast('Enter a research question first.');return}askInFlight=true;if(state.view!=='assistant')navigate('assistant');document.getElementById('questionInput').value=q;const btn=document.getElementById('askBtn');btn.disabled=true;btn.innerHTML='Finding evidence<span class="loading-dots"></span>';let mode='keyword',ranked=lexicalScores(q);try{if(state.aiWanted){await enableModel();if(state.aiReady){let out=await model(q,{pooling:'mean',normalize:true});let v=out.tolist()[0];const lex=new Map(lexicalScores(q).map(x=>[x.id,x.value]));ranked=STUDIES.map((d,i)=>({id:d.id,value:.7*embeddings[i].reduce((s,x,j)=>s+x*v[j],0)+.3*(lex.get(d.id)||0)+topicBonus(q,d.id)})).sort((a,b)=>b.value-a.value);mode='ai'}}if(!ranked.length||ranked[0].value<(mode==='ai'?.12:.06)){state.answer=`<div class="answer"><h3>No supporting evidence found</h3><p>This collection does not contain enough matching evidence for “${esc(q)}”. Try a named experiment, material, smoke-detection question or combustion condition.</p></div>`}else{state.answer=synthesize(q,ranked.slice(0,3).map(x=>x.id),mode)}let root=document.getElementById('answerRoot');if(root){root.innerHTML=state.answer;root.scrollIntoView({behavior:'smooth',block:'nearest'})}}catch(error){state.answer=synthesize(q,lexicalScores(q).slice(0,3).map(x=>x.id),'keyword');let root=document.getElementById('answerRoot');if(root)root.innerHTML=`<p class="answer-error">Semantic matching failed for this question. Showing offline keyword evidence.</p>`+state.answer}finally{askInFlight=false;let currentBtn=document.getElementById('askBtn');if(currentBtn){currentBtn.disabled=false;currentBtn.innerHTML=`Find evidence ${icon('arrow')}`}}}
function downloadable(name,content,type){const blob=new Blob([content],{type});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Export prepared: '+name)}
function exportData(type){const metadata={title:'Flame in Freefall',review_date:'2026-11-14',data_level:'Curated investigation metadata; no raw run files',mission_context:missions[state.mission].name,score_method:'10*directness + 6*mission_fit + 4*documented_detail; all curator-assigned 0–5',limitations:['No direct partial-gravity records included','No fire-risk probabilities or operational thresholds','Not-extracted values are missing, not zero'],sources:SOURCES};const rows=(type==='comparison'?state.selected.map(study):state.view==='explore'?filtered():STUDIES).map(d=>({...d,relevance_score:score(d),directness_score:d.direct,mission_fit_score:d.mission[state.mission],detail_score:d.detail,source_urls:d.sources.map(k=>SOURCES[k].url),verifiedO2_note:'No numeric run oxygen fraction extracted',verifiedFlow_note:d.verifiedFlow!==null?'Investigation description; not a loaded raw run':'No numeric run airflow extracted'}));if(type==='csv'){let fields=['id','name','category','fuel','hardware','shape','summary','finding','implication','oxygen','airflow','pressure','variables','measurements','limits','relevance_score','directness_score','mission_fit_score','detail_score','source_urls'];const cell=v=>'"'+String(Array.isArray(v)?v.join(' | '):v??'').replace(/"/g,'""')+'"';downloadable('Flame_in_Freefall_metadata.csv','\uFEFF'+fields.join(',')+'\r\n'+rows.map(d=>fields.map(f=>cell(d[f])).join(',')).join('\r\n'),'text/csv;charset=utf-8')}else if(type==='schema'){downloadable('Flame_in_Freefall_run_template.json',JSON.stringify({description:'Empty extraction template. Null values are intentionally missing; no experimental data supplied.',units:'Explicit per field; use mole/volume fraction for oxygen, Pa for pressure, m/s for flow, m for geometry and g0 for gravity.',run:{investigation_id:null,run_id:null,source_file_url:null,source_file_sha256:null,material:null,fuel_composition:null,geometry:{shape:null,length_m:null,width_m:null,thickness_m:null,droplet_diameter_m:null},oxygen_volume_fraction:null,total_pressure_Pa:null,gas_balance:null,flow_velocity_m_s:{x:null,y:null,z:null},gravity_g0:null,gravity_orientation:null,temperature_K:null,diagnostics:[],response:{ignited:null,spread_rate_m_s:null,extinguished:null,extinction_time_s:null,heat_release_W:null,smoke_particle_diameter_m:null},measurement_uncertainty:null,configuration_notes:null},checks:['Match sample configuration before pooling','Distinguish stream oxygen from ambient oxygen','Separate planned ranges from measured run conditions','Retain non-detections and uncertainty','No interpolation to partial gravity without validation']},null,2),'application/json')}else downloadable(type==='comparison'?'Flame_in_Freefall_comparison.json':'Flame_in_Freefall_metadata.json',JSON.stringify({...metadata,investigations:rows},null,2),'application/json')}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-close-drawer]');if(!b)return;if(b.dataset.view){navigate(b.dataset.view);return}if(b.dataset.mission!==undefined){state.mission=Number(b.dataset.mission);storeState();render();return}if(b.dataset.study){showStudy(b.dataset.study);return}if(b.hasAttribute('data-close-drawer')){closeDrawer();return}if(b.dataset.category){state.category=b.dataset.category;if(state.view==='explore'){document.getElementById('exploreCategories').innerHTML=categoryButtons();updateStudyList()}else render();return}if(b.dataset.filterCategory){state.category=b.dataset.filterCategory;navigate('explore');return}if(b.hasAttribute('data-clear-filters')){state.query='';state.fuel='All';state.category='All';render();return}if(b.dataset.remove){state.selected=state.selected.filter(x=>x!==b.dataset.remove);storeState();render();return}if(b.hasAttribute('data-clear-compare')){state.selected=[];storeState();render();return}if(b.dataset.preset){state.selected=({materials:['BASS-II','SAFFIRE-I'],cool:['FLEX','CFI','CFI-G'],detection:['SAME','SAME-R','DAFT']})[b.dataset.preset];storeState();render();return}if(b.dataset.question!==undefined){ask(questions[Number(b.dataset.question)]);return}if(b.dataset.export){exportData(b.dataset.export);return}if(b.dataset.toggleStudy){let id=b.dataset.toggleStudy;selection(id,!state.selected.includes(id));b.innerHTML=icon('compare')+(state.selected.includes(id)?'Remove from comparison':'Add to comparison');return}if(b.dataset.atmo){state.oxygen=b.dataset.atmo==='earth'?21:30;state.pressure=b.dataset.atmo==='earth'?14.7:10.2;document.getElementById('oxygenSlider').value=state.oxygen;document.getElementById('pressureSlider').value=state.pressure;updateAtmosphere();return}});
document.addEventListener('input',e=>{if(e.target.id==='studySearch'){state.query=e.target.value;updateStudyList()}if(e.target.id==='oxygenSlider'){state.oxygen=Number(e.target.value);updateAtmosphere()}if(e.target.id==='pressureSlider'){state.pressure=Number(e.target.value);updateAtmosphere()}});
document.addEventListener('change',e=>{if(e.target.dataset.select){selection(e.target.dataset.select,e.target.checked)}if(e.target.id==='fuelFilter'){state.fuel=e.target.value;updateStudyList()}if(e.target.id==='sortFilter'){state.sort=e.target.value;updateStudyList()}if(e.target.id==='enableAI'){state.aiWanted=e.target.checked;if(e.target.checked)enableModel();else{let el=document.getElementById('modelStatus');el.textContent='Offline keyword mode · questions processed locally'}}});
document.addEventListener('submit',e=>{if(e.target.id==='askForm'){e.preventDefault();ask(document.getElementById('questionInput').value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.drawer'))closeDrawer();document.getElementById('sidebar').classList.remove('open')}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();navigate('explore');document.getElementById('studySearch').focus()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='questionInput'){e.preventDefault();ask(e.target.value)}if(e.key==='Tab'&&document.querySelector('.drawer')){let f=[...document.querySelector('.drawer').querySelectorAll('button,a[href],input,select,textarea')].filter(x=>!x.disabled);let first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.getElementById('globalSearch').addEventListener('click',()=>{navigate('explore');document.getElementById('studySearch').focus()});
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
STUDIES[0].detail=4;
render();

</script>
</body></html>
